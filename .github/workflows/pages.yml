name: Deploy Ada Hub to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cs-feedback-dashboard-vg98x6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Tries to enable Pages automatically on first run; if the token
          # lacks permission, enable it once by hand: repo Settings -> Pages ->
          # Source: GitHub Actions.
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
